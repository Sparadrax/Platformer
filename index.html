<!DOCTYPE html>
<!-- Phaser platformer. Boot and loading scenes prepare assets before the game scene creates platforms and a controllable player. -->
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>test</title>
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: Arial, sans-serif;
                /* background-color: #040218; */
            }
    
            ol, ul {
                list-style: none;
            }
    
            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }
    
            a {
                text-decoration: none;
                color: inherit;
            }
        </style>
        <link rel="stylesheet" href="/Theme.css?v=1">
</head>
    <body>
        <div id="game-container"></div>
        <script src="./phaser.js"></script>
        <!-- Load the project entry module after its controls and view containers exist. -->
        <script type="module" src="./src/main.js"></script>
    </body>
    </html>
